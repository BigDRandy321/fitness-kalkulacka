<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness kalkulačka</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hlavicka">
    <h1>Fitness kalkulačka</h1>
  </header>
  <main class="obal">

    <section class="panel">
      <h2>Nastavení</h2>

      <div class="nastaveni">
        <label for="vaha">Moje váha (kg)</label>
        <input id="vaha" type="number" min="30" max="250" value="80">

        <label for="vek">Věk</label>
        <input id="vek" type="number" min="10" max="100" value="18">

        <label for="vyska">Výška (cm)</label>
        <input id="vyska" type="number" min="120" max="230" value="180">

        <label for="pohlavi">Pohlaví</label>
        <select id="pohlavi">
          <option value="muz">Muž</option>
          <option value="zena">Žena</option>
        </select>

        <label for="zdatnost">Sportovní zdatnost</label>
        <select id="zdatnost">
          <option value="0.9">Začátečník</option>
          <option value="1">Normální</option>
          <option value="1.1">Sportovec</option>
        </select>
      </div>

      <h2>Nabídka aktivit</h2>
      <p class="popis">
        Vyber aktivitu, nastav počet minut a intenzitu.
      </p>

      <div id="nabidkaAktivit" class="seznam-karet"></div>
    </section>

    <section class="panel">
      <h2>Můj denní trénink</h2>
      <p class="popis">
        Tady se zobrazují přidané aktivity.
      </p>

      <div id="denikAktivit" class="denik"></div>

      <div class="souhrn">
        <p>Celkem spáleno:</p>
        <strong id="celkemKalorie">0 kcal</strong>
        <span id="hodnoceniDne">Zatím nebyla přidána žádná aktivita.</span>
      </div>

      <button id="smazatVse" class="tlacitko smazat">
        Smazat celý deník
      </button>
    </section>

  </main>

  <footer class="paticka">
    <p>Projekt: Fitness kalkulačka</p>
  </footer>

  <script type="module" src="script.js"></script>

</body>
</html>
